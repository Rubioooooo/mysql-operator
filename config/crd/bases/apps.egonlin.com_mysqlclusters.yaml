              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level lifecycle state of the cluster.
                enum:
                - Pending
                - Initializing
                - Running
                - Degraded
                - Failed
                type: string
              primary:
                description: Primary is the currently observed primary MySQL member.
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of MySQL members currently
                  ready.
                format: int32
                type: integer
              replicaTransition:
                description: |-
                  ReplicaTransition records an active replica-count transition. Nil means no
                  replica-count transition is currently recorded.
                properties:
                  fromReplicas:
                    description: FromReplicas is the last stable replica count from
                      which the transition began.
                    format: int32
                    type: integer
                  targetReplicas:
                    description: TargetReplicas is the current desired replica count
                      for the transition.
                    format: int32
                    type: integer
